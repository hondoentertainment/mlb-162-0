name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Both projects run on Chromium; mobile is the primary form factor, so it
      # is not optional.
      # Includes the visual regression spec: screenshots are compared against
      # the Linux Chromium baselines in e2e/__screenshots__.
      - name: End-to-end (desktop + mobile)
        run: npx playwright test

      # Expected / actual / diff PNGs for any failed screenshot assertion.
      - name: Upload Playwright failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
